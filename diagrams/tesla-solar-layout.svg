<text class="mono" x="28" y="798">Roof geometry vector-traced from Sunrun permit sheet PV-2.0 (site plan, 1/16″ = 1′-0″); scale calibrated on AR-03 = 168.2 sq ft. All planes 24° pitch.</text>
<text class="mono" x="28" y="814">Zones sit on Sunrun’s engineered arrays: A↔AR-01, B↔AR-02, C↔AR-03, D↔AR-04, E↔AR-05 (existing roof planes); G = new garage south face.</text>
<text class="mono" x="28" y="830">2nd-floor addition extent TBD pending the AMS roof plan — no roof-plan sheet found in the permit set on file (AMS A-01.01/02 are floor plans only),</text>
<text class="mono" x="28" y="846">so the traced Sunrun (existing) roof is shown unchanged. Yields assume Redwood City irradiance ≈1,490 kWh/kW·yr at 164°/24°, ≈1,380 at 254°,</text>
<text class="mono" x="28" y="862">≈1,150 at 74°, ≈1,060 at 344°. Fire setbacks per CRC R324.6 / CFC 1204: 18″ at ridges + 3′ access pathways — same rules Sunrun permitted under.</text>
