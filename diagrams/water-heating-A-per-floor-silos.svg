<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 294" role="img" aria-label="Per-floor plumbing: one cold main splits to two independent tank-plus-booster chains, one serving each floor">
<style>
  .bg { fill:#F6F8F7; }
  .box { fill:#FFFFFF; stroke:#DBE3DF; stroke-width:1.5; }
  .box.on { stroke:#009477; }
  .box.off { stroke:#C96F35; stroke-dasharray:5 4; }
  .box.boost { stroke:#C96F35; }
  .w { stroke:#009477; stroke-width:2; fill:none; }
  .w.off { stroke:#C96F35; stroke-dasharray:5 4; }
  .wc { stroke:#8A968F; stroke-width:2; fill:none; }
  .rc { stroke:#8A968F; stroke-width:1.5; fill:none; stroke-dasharray:4 4; }
  text { font-family:'Avenir Next','Helvetica Neue',system-ui,sans-serif; font-size:13.5px; font-weight:600; fill:#14201D; }
  .t2 { font-family:'SF Mono',Menlo,monospace; font-size:10.5px; font-weight:400; fill:#57665F; }
  .cut { font-family:'SF Mono',Menlo,monospace; font-size:11px; font-weight:700; fill:#8F4C20; }
  .cap { font-family:'SF Mono',Menlo,monospace; font-size:11px; font-weight:600; fill:#8F4C20; letter-spacing:0.1em; }
</style>
<rect class="bg" x="0" y="0" width="760" height="294"/>
<text class="cap" x="12" y="22">WATER HEATING · TOPOLOGY A · PER-FLOOR SILOS</text>
<g transform="translate(0,34)">
      <line class="wc" x1="110" y1="131" x2="130" y2="131"/>
      <line class="wc" x1="130" y1="66" x2="130" y2="196"/>
      <line class="wc" x1="130" y1="66" x2="170" y2="66"/>
      <line class="wc" x1="130" y1="196" x2="170" y2="196"/>
      <line class="w" x1="320" y1="66" x2="350" y2="66"/>
      <line class="w" x1="480" y1="66" x2="510" y2="66"/>
      <line class="w" x1="320" y1="196" x2="350" y2="196"/>
      <line class="w" x1="480" y1="196" x2="510" y2="196"/>
      <rect class="box" x="10" y="105" width="100" height="52" rx="7"/>
      <text x="60" y="127" text-anchor="middle">Cold main</text>
      <text class="t2" x="60" y="145" text-anchor="middle">60 °F</text>
      <rect class="box on" x="170" y="40" width="150" height="52" rx="7"/>
      <text x="245" y="62" text-anchor="middle">Tank U · 80 gal</text>
      <text class="t2" x="245" y="80" text-anchor="middle">HPWH · 140 °F</text>
      <rect class="box boost" x="350" y="40" width="130" height="52" rx="7"/>
      <text x="415" y="62" text-anchor="middle">Booster U</text>
      <text class="t2" x="415" y="80" text-anchor="middle">18 kW</text>
      <rect class="box on" x="510" y="40" width="240" height="52" rx="7"/>
      <text x="630" y="62" text-anchor="middle">Floor 2 bathrooms only</text>
      <text class="t2" x="630" y="80" text-anchor="middle">2 showers fine · a 3rd goes cold</text>
      <rect class="box on" x="170" y="170" width="150" height="52" rx="7"/>
      <text x="245" y="192" text-anchor="middle">Tank M · 80 gal</text>
      <text class="t2" x="245" y="210" text-anchor="middle">HPWH · 140 °F</text>
      <rect class="box boost" x="350" y="170" width="130" height="52" rx="7"/>
      <text x="415" y="192" text-anchor="middle">Booster M</text>
      <text class="t2" x="415" y="210" text-anchor="middle">18 kW</text>
      <rect class="box on" x="510" y="170" width="240" height="52" rx="7"/>
      <text x="630" y="192" text-anchor="middle">Floor 1 + basement only</text>
      <text class="t2" x="630" y="210" text-anchor="middle">idles even if Floor 2 is drowning</text>
    </g>
</svg>
