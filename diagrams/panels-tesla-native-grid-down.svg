<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 474" role="img" aria-label="Tesla-native topology, grid down: the Gateway contactor is open; PG&E, meter and Panel B are dead; Panel A with Powerwalls and solar form a 23 kW island">
<style>
  .bg { fill:#F6F8F7; }
  .box { fill:#FFFFFF; stroke:#DBE3DF; stroke-width:1.5; }
  .box.on { stroke:#009477; }
  .box.off { stroke:#C96F35; stroke-dasharray:5 4; }
  .box.boost { stroke:#C96F35; }
  .w { stroke:#009477; stroke-width:2; fill:none; }
  .w.off { stroke:#C96F35; stroke-dasharray:5 4; }
  .wc { stroke:#8A968F; stroke-width:2; fill:none; }
  .rc { stroke:#8A968F; stroke-width:1.5; fill:none; stroke-dasharray:4 4; }
  text { font-family:'Avenir Next','Helvetica Neue',system-ui,sans-serif; font-size:13.5px; font-weight:600; fill:#14201D; }
  .t2 { font-family:'SF Mono',Menlo,monospace; font-size:10.5px; font-weight:400; fill:#57665F; }
  .cut { font-family:'SF Mono',Menlo,monospace; font-size:11px; font-weight:700; fill:#8F4C20; }
  .cap { font-family:'SF Mono',Menlo,monospace; font-size:11px; font-weight:600; fill:#8F4C20; letter-spacing:0.1em; }
</style>
<rect class="bg" x="0" y="0" width="680" height="474"/>
<text class="cap" x="12" y="22">PANELS · TESLA-NATIVE · GRID DOWN</text>
<g transform="translate(0,34)">
        <line class="w off" x1="95" y1="92" x2="95" y2="150"/>
        <line class="w off" x1="170" y1="176" x2="320" y2="176"/>
        <line class="w off" x1="250" y1="176" x2="250" y2="218"/>
        <text class="cut" x="258" y="238">✂ OPEN</text>
        <line class="w" x1="250" y1="250" x2="250" y2="286"/>
        <line class="w" x1="250" y1="286" x2="320" y2="286"/>
        <line class="w" x1="415" y1="312" x2="415" y2="350"/>
        <line class="w" x1="510" y1="376" x2="540" y2="376"/>
        <line class="w" x1="600" y1="312" x2="600" y2="350"/>
        <rect class="box off" x="20" y="40" width="150" height="52" rx="7"/>
        <text x="95" y="62" text-anchor="middle">PG&amp;E grid</text>
        <text class="t2" x="95" y="80" text-anchor="middle">DEAD</text>
        <rect class="box off" x="20" y="150" width="150" height="52" rx="7"/>
        <text x="95" y="172" text-anchor="middle">Meter + main</text>
        <text class="t2" x="95" y="190" text-anchor="middle">no source</text>
        <rect class="box off" x="320" y="150" width="190" height="52" rx="7"/>
        <text x="415" y="172" text-anchor="middle">Panel B — boosters</text>
        <text class="t2" x="415" y="190" text-anchor="middle">stranded on the grid side · dark</text>
        <rect class="box on" x="320" y="260" width="190" height="52" rx="7"/>
        <text x="415" y="282" text-anchor="middle">Backup Gateway</text>
        <text class="t2" x="415" y="300" text-anchor="middle">contactor OPEN</text>
        <rect class="box on" x="320" y="350" width="190" height="52" rx="7"/>
        <text x="415" y="372" text-anchor="middle">Panel A — essentials</text>
        <text class="t2" x="415" y="390" text-anchor="middle">the 23 kW island</text>
        <rect class="box on" x="540" y="350" width="120" height="52" rx="7"/>
        <text x="600" y="372" text-anchor="middle">Powerwall ×2</text>
        <text class="t2" x="600" y="390" text-anchor="middle">now THE source</text>
        <rect class="box on" x="540" y="260" width="120" height="52" rx="7"/>
        <text x="600" y="282" text-anchor="middle">Solar</text>
        <text class="t2" x="600" y="300" text-anchor="middle">keeps charging PW</text>
      </g>
</svg>
